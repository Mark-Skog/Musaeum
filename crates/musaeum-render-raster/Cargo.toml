[package]
name = "musaeum-render-raster"
description = "Isolated worker process that renders comic book archives (CBZ, CBR) into shared memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
musaeum-archive.workspace = true
musaeum-sandbox.workspace = true
musaeum-shm.workspace = true
musaeum-worker.workspace = true
quick-xml.workspace = true

[dev-dependencies]
gen-fixtures.workspace = true
musaeum-core.workspace = true
musaeum-worker = { workspace = true, features = ["harness"] }

[lints]
workspace = true
