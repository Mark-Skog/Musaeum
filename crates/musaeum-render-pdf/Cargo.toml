[package]
name = "musaeum-render-pdf"
description = "Isolated worker process that rasterizes PDF tiles with PDFium into shared memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "musaeum-pdf-annots"
path = "src/annots_main.rs"

[dependencies]
memmap2.workspace = true
musaeum-ingest.workspace = true
musaeum-pdf-annot.workspace = true
musaeum-sandbox.workspace = true
musaeum-shm.workspace = true
musaeum-worker.workspace = true
pdfium-render.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gen-fixtures.workspace = true
musaeum-core.workspace = true
musaeum-sandbox.workspace = true
musaeum-vision.workspace = true
musaeum-worker = { workspace = true, features = ["harness"] }

[lints]
workspace = true
