[workspace]
resolver = "3"
members = [
    "crates/musaeum-shm",
    "crates/musaeum-worker",
    "crates/musaeum-archive",
    "crates/musaeum-core",
    "crates/musaeum-djvu",
    "crates/musaeum-flow",
    "crates/musaeum-sandbox",
    "crates/musaeum-render-djvu",
    "crates/musaeum-render-pdf",
    "crates/musaeum-render-raster",
    "crates/musaeum-fs",
    "crates/musaeum-ingest",
    "crates/musaeum-library",
    "crates/musaeum-vision",
    "crates/musaeum-tesseract",
    "crates/musaeum-ocr",
    "crates/musaeum-ocr-worker",
    "crates/musaeum-pdf-annot",
    "crates/musaeum-report",
    "crates/musaeum-i18n",
    "apps/cli",
    "apps/desktop/src-tauri",
    "tools/corpus-check",
    "tools/gen-fixtures",
    "tools/library-bench",
    "tools/pool-bench",
    "tools/sandbox-audit",
    "tools/visual-check",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
musaeum-archive = { path = "crates/musaeum-archive" }
musaeum-core = { path = "crates/musaeum-core" }
musaeum-djvu = { path = "crates/musaeum-djvu" }
musaeum-flow = { path = "crates/musaeum-flow" }
musaeum-fs = { path = "crates/musaeum-fs" }
musaeum-ingest = { path = "crates/musaeum-ingest" }
musaeum-library = { path = "crates/musaeum-library" }
musaeum-sandbox = { path = "crates/musaeum-sandbox" }
musaeum-shm = { path = "crates/musaeum-shm" }
musaeum-vision = { path = "crates/musaeum-vision" }
musaeum-tesseract = { path = "crates/musaeum-tesseract" }
musaeum-ocr = { path = "crates/musaeum-ocr" }
musaeum-pdf-annot = { path = "crates/musaeum-pdf-annot" }
musaeum-report = { path = "crates/musaeum-report" }
musaeum-i18n = { path = "crates/musaeum-i18n" }
musaeum-worker = { path = "crates/musaeum-worker" }
gen-fixtures = { path = "tools/gen-fixtures" }

blake3 = "1"
# Checks the OCR models against their pinned SHA-256, the hashes tools/fetch-ocr.ps1 checks too.
sha2 = "0.10"
flate2 = "1"
memmap2 = "0.9"
# Only the raw FPDF_* bindings are used, so the image and mutex features stay off.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
quick-xml = "0.42"
# SQLite is compiled in, so the build decides its version and that FTS5 is there.
rusqlite = { version = "0.41", features = ["backup", "bundled", "functions", "limits"] }
serde = { version = "1", features = ["derive"] }
# The full-text index of the books' contents (the plan: Tantivy for full text, BM25). Without its
# default features: no zstd (a C library) and no stemmer, which would suit one language only.
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
# Numbers read to their last bit: a position in a book written to JSON-LD comes back the same.
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri ={ version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2"
trash = "5"
# UUIDv7 for annotations: the same crate Tauri already builds.
uuid = { version = "1.29", default-features = false, features = ["std", "v7"] }
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every unsafe block in this workspace crosses a process or FFI boundary, so each
# one has to state why it is sound.
undocumented_unsafe_blocks = "deny"

# Decoding, resampling and compressing images unoptimized is tens of times slower, so tests of the
# comic worker would measure the build instead of the code. Only these crates are optimized.
[profile.dev.package]
# The line detector is pure arithmetic over a page of pixels: its tests and the corpus run in seconds
# optimized, minutes without.
musaeum-vision.opt-level = 3
fast_image_resize.opt-level = 3
fdeflate.opt-level = 3
gif.opt-level = 3
image.opt-level = 3
image-webp.opt-level = 3
jpeg-encoder.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
weezl.opt-level = 3
zune-jpeg.opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
