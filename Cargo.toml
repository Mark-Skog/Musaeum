[workspace]
resolver = "3"
members = [
    "crates/musaeum-shm",
    "crates/musaeum-core",
    "crates/musaeum-sandbox",
    "crates/musaeum-render-pdf",
    "crates/musaeum-fs",
    "crates/musaeum-ingest",
    "crates/musaeum-library",
    "apps/cli",
    "apps/desktop/src-tauri",
    "tools/gen-fixtures",
    "tools/library-bench",
    "tools/pool-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
musaeum-core = { path = "crates/musaeum-core" }
musaeum-fs = { path = "crates/musaeum-fs" }
musaeum-ingest = { path = "crates/musaeum-ingest" }
musaeum-library = { path = "crates/musaeum-library" }
musaeum-sandbox = { path = "crates/musaeum-sandbox" }
musaeum-shm = { path = "crates/musaeum-shm" }
gen-fixtures = { path = "tools/gen-fixtures" }

blake3 = "1"
flate2 = "1"
memmap2 = "0.9"
# Only the raw FPDF_* bindings are used, so the image and mutex features stay off.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
quick-xml = "0.42"
# SQLite is compiled in, so the build decides its version and that FTS5 is there.
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2"
trash = "5"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every unsafe block in this workspace crosses a process or FFI boundary, so each
# one has to state why it is sound.
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
