[package]
name = "musaeum-desktop"
description = "Musaeum's Tauri shell: tile delivery to the WebView and the Phase 0 benchmark harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
musaeum-core.workspace = true
musaeum-fs.workspace = true
musaeum-library.workspace = true
musaeum-sandbox.workspace = true
musaeum-shm.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[target.'cfg(windows)'.dependencies]
# Must stay on the versions that wry uses, or the COM types will not line up.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
