[package]
name = "sandbox-audit"
description = "Audits, from outside, the sandbox of every worker a running Musaeum has started."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
musaeum-core.workspace = true
musaeum-library.workspace = true
musaeum-ocr.workspace = true
musaeum-pdf-annot.workspace = true
musaeum-sandbox.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
