# Keeps every Rust dependency compatible with Musaeum's GPL-3.0-or-later. `tools/check-licenses.mjs`
# runs this, along with the same check for npm packages and for what is vendored.

[graph]
# All the systems in the plan, so a dependency that only exists on one does not get through
# unnoticed until the port to that system.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
# Anything not listed here is refused, so a new license needs a decision. Most notably absent:
# GPL-2.0-only, which GPL-3.0 cannot link; AGPL-3.0, which would change what the whole app must
# offer its users; SSPL and anything non-commercial or source-available, which are not free.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    # Copyleft per file, and explicitly compatible with the GPL unless a file says otherwise.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# Some of this list is only used by what is vendored, which reads it from here too.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates, which are the GPL-3.0-or-later this is all about.
ignore = true

[bans]
# Tauri's tree has several versions of a few crates, which costs size, not freedom.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io. A git dependency would be a decision, not an accident.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Reported, for a person to judge: much of this tree is Tauri's, and is not ours to replace.
unmaintained = "workspace"
yanked = "warn"
